<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-label="Veyra for VS Code: Code Guard, Live Server, Git Graph, API Client and more extensions.">
<style>.f{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif} .sh{animation:sh 6s ease-in-out infinite} @keyframes sh{0%,60%{transform:translateX(-200px)}100%{transform:translateX(800px)}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1c15"/><stop offset="1" stop-color="#07110d"/></linearGradient>
  <linearGradient id="ic" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#ffd36b"/><stop offset="1" stop-color="#e07b00"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#e07b00" stop-opacity=".22"/><stop offset="1" stop-color="#e07b00" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#ffd36b" stop-opacity="0"/><stop offset=".5" stop-color="#ffd36b" stop-opacity=".7"/><stop offset="1" stop-color="#ffd36b" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect width="600" height="210" rx="18"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="600" height="210" fill="url(#bg)"/>
  <ellipse cx="70" cy="60" rx="170" ry="130" fill="url(#glow)"/>
  <rect class="sh" x="0" y="0" width="180" height="2" fill="url(#line)"/>
</g>
<rect x=".5" y=".5" width="599" height="209" rx="18" fill="none" stroke="#1f3a2e"/>
<g transform="translate(30 30)">
