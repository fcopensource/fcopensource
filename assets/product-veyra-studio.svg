<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-label="Veyra Studio: Local-first AI code editor with Git, a real terminal and Veyra AI built in.">
<style>.f{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif} .sh{animation:sh 6s ease-in-out infinite} @keyframes sh{0%,60%{transform:translateX(-200px)}100%{transform:translateX(800px)}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1c15"/><stop offset="1" stop-color="#07110d"/></linearGradient>
  <linearGradient id="ic" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#9d8cff"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#4f46e5" stop-opacity=".22"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#9d8cff" stop-opacity="0"/><stop offset=".5" stop-color="#9d8cff" stop-opacity=".7"/><stop offset="1" stop-color="#9d8cff" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect width="600" height="210" rx="18"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="600" height="210" fill="url(#bg)"/>
  <ellipse cx="70" cy="60" rx="170" ry="130" fill="url(#glow)"/>
  <rect class="sh" x="0" y="0" width="180" height="2" fill="url(#line)"/>
</g>
<rect x=".5" y=".5" width="599" height="209" rx="18" fill="none" stroke="#1f3a2e"/>
<g transform="translate(30 30)">
  <rect y="6" width="76" height="76" rx="20" fill="#4f46e5" opacity=".55"/>
  <rect width="76" height="76" rx="20" fill="url(#ic)"/>
  <path d="M20 3h36a17 17 0 0 1 17 17v2C58 12 18 12 3 26v-6A17 17 0 0 1 20 3z" fill="#fff" opacity=".22"/>
  <g transform="translate(20 19) scale(1.5)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 4 12l5 5M15 7l5 5-5 5"/></g>
</g>
<g class="f">
  <text x="128" y="62" fill="#f2fbf6" font-size="25" font-weight="800" letter-spacing="-.4">Veyra Studio</text>
  <text x="128" y="96" fill="#9fb8ad" font-size="15.5">Local-first AI code editor with Git, a real terminal</text><text x="128" y="119" fill="#9fb8ad" font-size="15.5">and Veyra AI built in.</text>
  <g transform="translate(441.5 26)"><rect width="132.5" height="26" rx="13" fill="#4f46e5" fill-opacity=".16" stroke="#9d8cff" stroke-opacity=".45"/>
