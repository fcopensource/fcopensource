  <g transform="translate(128 160)"><rect width="170.9" height="28" rx="8" fill="#0f2119" stroke="#21402f"/><text x="85.45" y="18.5" text-anchor="middle" fill="#9fc4b4" font-size="12.5" font-weight="600">Windows · macOS · Linux</text></g><g transform="translate(306.9 160)"><rect width="152" height="28" rx="8" fill="#0f2119" stroke="#21402f"/><text x="76" y="18.5" text-anchor="middle" fill="#9fc4b4" font-size="12.5" font-weight="600">Rust · Tauri · React</text></g>
</g>
