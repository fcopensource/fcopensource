<style>.f{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif} .sh{animation:sh 6s ease-in-out infinite} @keyframes sh{0%,60%{transform:translateX(-200px)}100%{transform:translateX(800px)}}</style>
<defs>
