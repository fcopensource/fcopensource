<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-label="Daemon: A native terminal with a real shell and live system telemetry.">
<style>.f{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif} .sh{animation:sh 6s ease-in-out infinite} @keyframes sh{0%,60%{transform:translateX(-200px)}100%{transform:translateX(800px)}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1c15"/><stop offset="1" stop-color="#07110d"/></linearGradient>
  <linearGradient id="ic" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#8be3ff"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#0e7490" stop-opacity=".22"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#8be3ff" stop-opacity="0"/><stop offset=".5" stop-color="#8be3ff" stop-opacity=".7"/><stop offset="1" stop-color="#8be3ff" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect width="600" height="210" rx="18"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="600" height="210" fill="url(#bg)"/>
  <ellipse cx="70" cy="60" rx="170" ry="130" fill="url(#glow)"/>
  <rect class="sh" x="0" y="0" width="180" height="2" fill="url(#line)"/>
</g>
<rect x=".5" y=".5" width="599" height="209" rx="18" fill="none" stroke="#1f3a2e"/>
<g transform="translate(30 30)">
  <rect y="6" width="76" height="76" rx="20" fill="#0e7490" opacity=".55"/>
  <rect width="76" height="76" rx="20" fill="url(#ic)"/>
  <path d="M20 3h36a17 17 0 0 1 17 17v2C58 12 18 12 3 26v-6A17 17 0 0 1 20 3z" fill="#fff" opacity=".22"/>
  <g transform="translate(20 19) scale(1.5)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m7 10 3 2-3 2M12.5 15h4.5"/></g>
</g>
<g class="f">
  <text x="128" y="62" fill="#f2fbf6" font-size="25" font-weight="800" letter-spacing="-.4">Daemon</text>
  <text x="128" y="96" fill="#9fb8ad" font-size="15.5">A native terminal with a real shell and live system</text><text x="128" y="119" fill="#9fb8ad" font-size="15.5">telemetry.</text>
  <g transform="translate(469.9 26)"><rect width="104.1" height="26" rx="13" fill="#0e7490" fill-opacity=".16" stroke="#8be3ff" stroke-opacity=".45"/>
    <text x="52.05" y="17.5" text-anchor="middle" fill="#8be3ff" font-size="12" font-weight="700">Open source</text></g>
  <g transform="translate(128 160)"><rect width="70.1" height="28" rx="8" fill="#0f2119" stroke="#21402f"/><text x="35.05" y="18.5" text-anchor="middle" fill="#9fc4b4" font-size="12.5" font-weight="600">Desktop</text></g><g transform="translate(206.1 160)"><rect width="51.2" height="28" rx="8" fill="#0f2119" stroke="#21402f"/><text x="25.6" y="18.5" text-anchor="middle" fill="#9fc4b4" font-size="12.5" font-weight="600">Rust</text></g>
</g>
</svg>